name: Session Planner Staging Canary Recovery

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Remove the exact reviewed canary marker from staging.
        required: true
        default: false
        type: boolean
      confirmation:
        description: For apply, type RECOVER_SESSION_PLANNER_STAGING_CANARY exactly.
        required: false
        type: string
      recovery_path:
        description: Exact private recovery path from the canary receipt.
        required: true
        type: string
      expected_recovery_sha256:
        description: Exact recovery package SHA-256 from the canary receipt.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: session-planner-migration-staging
  cancel-in-progress: false

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: platform-staging
    env:
      APPLY: ${{ inputs.apply }}
      CONFIRMATION: ${{ inputs.confirmation }}
      SESSION_PLANNER_CANARY_TARGET: staging
      STAGING_QA_BASE_URL: https://staging.footballscience.xyz
      LIVE_QA_BASE_URL: https://footballscience.xyz
      STAGING_SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      CANONICAL_PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.CANONICAL_PRODUCTION_SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      STAGING_QA_USERNAME: ${{ secrets.STAGING_QA_USERNAME }}
      STAGING_QA_PASSWORD: ${{ secrets.STAGING_QA_PASSWORD }}
      SESSION_PLANNER_CANARY_RECOVERY_PATH: ${{ inputs.recovery_path }}
      SESSION_PLANNER_CANARY_EXPECTED_RECOVERY_SHA256: ${{ inputs.expected_recovery_sha256 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Verify isolated staging recovery context
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REPOSITORY" != "maklind88/footballscience" ] ||
            [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Session Planner staging canary recovery requires canonical main." >&2
            exit 1
          fi
          required=(
            STAGING_SUPABASE_PROJECT_REF
            CANONICAL_PRODUCTION_SUPABASE_PROJECT_REF
            SUPABASE_URL
            SUPABASE_SECRET_KEY
            STAGING_QA_USERNAME
            STAGING_QA_PASSWORD
            SESSION_PLANNER_CANARY_RECOVERY_PATH
            SESSION_PLANNER_CANARY_EXPECTED_RECOVERY_SHA256
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required platform-staging value: $name" >&2
              exit 1
            fi
          done
          printf '%s\n' \
            "$STAGING_SUPABASE_PROJECT_REF" \
            "$CANONICAL_PRODUCTION_SUPABASE_PROJECT_REF" \
            "$STAGING_QA_USERNAME" |
            while IFS= read -r value; do echo "::add-mask::$value"; done
          if [ "$STAGING_SUPABASE_PROJECT_REF" = "$CANONICAL_PRODUCTION_SUPABASE_PROJECT_REF" ]; then
            echo "Staging and production Supabase refs must differ." >&2
            exit 1
          fi
          if ! [[ "$SESSION_PLANNER_CANARY_EXPECTED_RECOVERY_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "The exact recovery package SHA-256 is required." >&2
            exit 1
          fi
          if [ "$APPLY" = "true" ]; then
            if [ "$CONFIRMATION" != "RECOVER_SESSION_PLANNER_STAGING_CANARY" ]; then
              echo "Exact canary recovery confirmation is required." >&2
              exit 1
            fi
          elif [ -n "$CONFIRMATION" ]; then
            echo "Recovery confirmation must be empty for a dry-run." >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run qa:supabase
      - name: Run content-free canary recovery
        shell: bash
        run: |
          set -euo pipefail
          args=(--json)
          if [ "$APPLY" = "true" ]; then
            args+=(
              --apply
              --confirm="$CONFIRMATION"
            )
          fi
          node scripts/session-planner-staging-canary-recovery.mjs "${args[@]}" \
            > session-planner-staging-canary-recovery-summary.json
      - name: Verify content-free recovery result
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const summary = JSON.parse(
            fs.readFileSync(
              "session-planner-staging-canary-recovery-summary.json",
              "utf8"
            )
          );
          const apply = process.env.APPLY === "true";
          if (
            summary.ok !== true ||
            summary.ready !== true ||
            summary.target !== "staging" ||
            summary.projectRef !== process.env.STAGING_SUPABASE_PROJECT_REF ||
            summary.containsCoachingContent !== false ||
            summary.recoveryPackageReceipt?.containsCoachingContent !== false ||
            summary.mode !== (apply ? "recovery" : "dry-run")
          ) {
            throw new Error("Session Planner canary recovery result is not safe.");
          }
          if (apply && summary.recovery?.verified !== true) {
            throw new Error("Session Planner canary recovery proof is incomplete.");
          }
          const lines = [
            "## Session Planner staging canary recovery",
            "",
            `- Mode: ${summary.mode}`,
            `- Recovery package SHA-256: \`${summary.recoveryPackageReceipt.contentSha256}\``,
            `- Recovery required: ${summary.recoveryRequired ? "yes" : "no"}`,
          ];
          if (apply) {
            lines.push(
              `- Exact baseline restored: ${summary.recovery.exactBaselineRestored ? "yes" : "no"}`,
              `- Concurrent colleague state preserved: ${summary.recovery.concurrentStatePreserved ? "yes" : "no"}`,
              "- Canary marker removal: verified"
            );
          } else {
            lines.push("- App-state writes: none");
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          NODE
