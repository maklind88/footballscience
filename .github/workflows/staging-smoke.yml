name: Staging Smoke

on:
  workflow_dispatch:
    inputs:
      verify_fresh_backup:
        description: Create and verify an isolated staging backup without restoring data.
        type: boolean
        default: false
      expected_backup_build_id:
        description: Exact reviewed staging buildId from client-config (SHA or Vercel deployment ID).
        type: string
        default: ''

jobs:
  smoke:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    timeout-minutes: 20
    env:
      LIVE_QA_BASE_URL: ${{ vars.LIVE_QA_BASE_URL || 'https://footballscience.xyz' }}
      STAGING_QA_BASE_URL: ${{ vars.STAGING_QA_BASE_URL }}
      STAGING_QA_PASSWORD: ${{ secrets.STAGING_QA_PASSWORD }}
      STAGING_QA_USERNAME: ${{ secrets.STAGING_QA_USERNAME }}
      LEADERBOARD_STAGING_QA_TEAM_ID: ${{ vars.LEADERBOARD_STAGING_QA_TEAM_ID }}
      STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:staging-env -- --required
      - name: Verify fresh staging backup and read-only restore
        if: inputs.verify_fresh_backup
        env:
          BACKUP_VERIFY_TARGET: staging
          BACKUP_EXPECTED_BUILD_ID: ${{ inputs.expected_backup_build_id }}
        run: node scripts/verify-fresh-app-state-backup.mjs
      - run: npm run qa:staging:required
