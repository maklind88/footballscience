name: Production Monitor
run-name: ${{ inputs.tracking_review && format('FS Player tracking release {0}', github.sha) || inputs.review_action && inputs.review_action != 'monitor' && format('DM/Schedule {0} {1}', inputs.review_action, github.sha) || 'Production Monitor' }}

on:
  workflow_dispatch:
    inputs:
      tracking_review:
        description: Exact-commit approval for the Seattle tracking release; never deploys
        type: boolean
        default: false
      review_action:
        description: Task-scoped manual review; diagnostics never deploys
        type: choice
        options:
          - monitor
          - diagnostics
          - release
        default: monitor
      expected_candidate_sha:
        description: Exact candidate SHA for the selected task review
        type: string
        default: ''
      expected_live_build_id:
        description: Exact existing production buildId for the selected task review
        type: string
        default: ''
      verify_fresh_backup:
        description: Create and verify a fresh production backup without restoring data.
        type: boolean
        default: false
      expected_backup_build_id:
        description: Exact reviewed production buildId from client-config (SHA or Vercel deployment ID).
        type: string
        default: ''
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ inputs.tracking_review && 'fs-player-tracking-review' || inputs.review_action && inputs.review_action != 'monitor' && 'dm-schedule-review' || 'production-monitor' }}
  cancel-in-progress: false

jobs:
  monitor:
    if: github.ref == 'refs/heads/main' && (!inputs.review_action || inputs.review_action == 'monitor') && !inputs.tracking_review
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    timeout-minutes: 20
    env:
      LIVE_QA_BASE_URL: ${{ vars.LIVE_QA_BASE_URL || 'https://footballscience.xyz' }}
      LIVE_QA_EXPECT_ADMIN: "1"
      LIVE_QA_PASSWORD: ${{ secrets.LIVE_QA_PASSWORD }}
      LIVE_QA_PEER_PASSWORD: ${{ secrets.LIVE_QA_PEER_PASSWORD }}
      LIVE_QA_PEER_USERNAME: ${{ secrets.LIVE_QA_PEER_USERNAME }}
      LIVE_QA_REQUIRE_PEER_CHAT: ${{ vars.LIVE_QA_REQUIRE_PEER_CHAT || '1' }}
      LIVE_QA_USERNAME: ${{ secrets.LIVE_QA_USERNAME }}
      LEADERBOARD_LIVE_QA_PASSWORD: ${{ secrets.LEADERBOARD_LIVE_QA_PASSWORD }}
      LEADERBOARD_LIVE_QA_TEAM_ID: ${{ vars.LEADERBOARD_LIVE_QA_TEAM_ID }}
      LEADERBOARD_LIVE_QA_USERNAME: ${{ secrets.LEADERBOARD_LIVE_QA_USERNAME }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run release:vercel-token
      - run: npx --yes vercel@53.2.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Verify fresh production backup and read-only restore
        if: github.event_name == 'workflow_dispatch' && inputs.verify_fresh_backup
        env:
          BACKUP_VERIFY_TARGET: production
          BACKUP_EXPECTED_BUILD_ID: ${{ inputs.expected_backup_build_id }}
        run: node scripts/verify-fresh-app-state-backup.mjs
      - run: npm run release:monitor

  dm-schedule-review:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/dm-reload-race-20261113' && (inputs.review_action == 'diagnostics' || inputs.review_action == 'release')
    name: DM/Schedule ${{ inputs.review_action }} review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: dm-schedule-review
      url: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
    steps:
      - name: Checkout exact reviewed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.15.0
      - name: Verify reviewed commit and unchanged live target
        env:
          REVIEW_ACTION: ${{ inputs.review_action }}
          EXPECTED_CANDIDATE_SHA: ${{ inputs.expected_candidate_sha }}
          EXPECTED_LIVE_BUILD_ID: ${{ inputs.expected_live_build_id }}
        run: node scripts/verify-dm-schedule-review-target.mjs

  dm-schedule-diagnostics:
    needs: dm-schedule-review
    if: inputs.review_action == 'diagnostics' && needs.dm-schedule-review.result == 'success'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble@sha256:b0ab6f3cb99aa7803adbc14d9027ec1785fc6e433b97e134e0f8fe61683b6b53
    timeout-minutes: 15
    concurrency:
      group: production-monitor
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.15.0
      - name: Install diagnostic dependencies without service credentials
        run: node scripts/ci-install.mjs
      - name: Recheck the exact target after the monitor queue
        env:
          REVIEW_ACTION: ${{ inputs.review_action }}
          EXPECTED_CANDIDATE_SHA: ${{ inputs.expected_candidate_sha }}
          EXPECTED_LIVE_BUILD_ID: ${{ inputs.expected_live_build_id }}
        run: node scripts/verify-dm-schedule-review-target.mjs
      - name: Run Schedule and two-account DM diagnostics
        env:
          LIVE_QA_BASE_URL: https://footballscience.xyz
          LIVE_QA_EXPECT_ADMIN: '1'
          LIVE_QA_REQUIRE_PEER_CHAT: '1'
          LIVE_QA_USERNAME: ${{ secrets.LIVE_QA_USERNAME }}
          LIVE_QA_PASSWORD: ${{ secrets.LIVE_QA_PASSWORD }}
          LIVE_QA_PEER_USERNAME: ${{ secrets.LIVE_QA_PEER_USERNAME }}
          LIVE_QA_PEER_PASSWORD: ${{ secrets.LIVE_QA_PEER_PASSWORD }}
        run: |
          node --input-type=module <<'NODE'
          for (const name of ['LIVE_QA_USERNAME', 'LIVE_QA_PASSWORD']) {
            if (!process.env[name]?.trim()) throw new Error(`Missing ${name}`);
          }
          if (Boolean(process.env.LIVE_QA_PEER_USERNAME?.trim()) !== Boolean(process.env.LIVE_QA_PEER_PASSWORD?.trim())) {
            throw new Error('Both peer credentials must be configured together.');
          }
          NODE
          npm run qa:live -- qa/production.live.spec.mjs --grep 'production test account can save and reload a schedule record|production peer accounts prove DM unread state and read receipt end-to-end'

  fs-player-tracking-review:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/fs-player-two-player-distance-20261119' && inputs.tracking_review && inputs.review_action == 'monitor'
    name: FS Player tracking release review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: fs-player-tracking-review
      url: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
    steps:
      - name: Checkout exact reviewed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.15.0
      - name: Verify reviewed commit and unchanged live target
        env:
          EXPECTED_CANDIDATE_SHA: ${{ inputs.expected_candidate_sha }}
          EXPECTED_LIVE_BUILD_ID: ${{ inputs.expected_live_build_id }}
        run: node scripts/verify-fs-player-tracking-review-target.mjs
