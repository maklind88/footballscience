name: Full QA

on:
  workflow_call:

permissions:
  contents: read

jobs:
  static:
    name: Static and security gates
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run release:preflight
      - run: npm run security:audit
      - run: npm run qa:static

  playwright:
    name: Playwright shard ${{ matrix.shard }} of 4
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run qa:playwright -- --shard=${{ matrix.shard }}/4
