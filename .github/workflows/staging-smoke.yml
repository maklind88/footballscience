name: Staging Smoke

on:
  workflow_dispatch:
    inputs:
      restore_staging_deployment:
        description: Explicitly authorized immutable staging deployment URL to restore; empty leaves routing unchanged.
        type: string
        default: ''
      restore_staging_source_sha:
        description: Exact reviewed 40-character source SHA for staging restore.
        type: string
        default: ''
      verify_save_acceptance:
        description: Run two-user saving acceptance with own synthetic staging fixtures and temporary peer account.
        type: boolean
        default: false
      save_candidate_client:
        description: Test only this candidate's saving client scripts in the QA browser; deployed staging assets remain unchanged.
        type: boolean
        default: false
      verify_save_readiness:
        description: Read-only Medical and Sessions acceptance prerequisites; no saved-data writes.
        type: boolean
        default: false
      expected_save_build_id:
        description: Exact staging buildId (SHA or deployment id) for the read-only saving probe.
        type: string
        default: ''
      verify_fresh_backup:
        description: Create and verify an isolated staging backup without restoring data.
        type: boolean
        default: false
      expected_backup_build_id:
        description: Exact reviewed staging buildId from client-config (SHA or Vercel deployment ID).
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ (inputs.verify_save_acceptance || inputs.restore_staging_deployment != '') && 'footballscience-production-edge-release' || format('staging-smoke-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    timeout-minutes: 20
    env:
      LIVE_QA_BASE_URL: ${{ vars.LIVE_QA_BASE_URL || 'https://footballscience.xyz' }}
      STAGING_QA_BASE_URL: ${{ vars.STAGING_QA_BASE_URL }}
      STAGING_QA_PASSWORD: ${{ secrets.STAGING_QA_PASSWORD }}
      STAGING_QA_USERNAME: ${{ secrets.STAGING_QA_USERNAME }}
      LEADERBOARD_STAGING_QA_TEAM_ID: ${{ vars.LEADERBOARD_STAGING_QA_TEAM_ID }}
      STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:staging-env -- --required
      - name: Install release traffic client in the disposable container
        if: inputs.restore_staging_deployment != ''
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends gh
      - name: Restore explicitly reviewed staging routing
        if: inputs.restore_staging_deployment != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          RESTORE_STAGING_DEPLOYMENT: ${{ inputs.restore_staging_deployment }}
          RESTORE_STAGING_SOURCE_SHA: ${{ inputs.restore_staging_source_sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          node --test qa/reviewed-staging-restore.test.mjs
          node scripts/restore-reviewed-staging.mjs
      - name: Verify fresh staging backup and read-only restore
        if: inputs.verify_fresh_backup
        env:
          BACKUP_VERIFY_TARGET: staging
          BACKUP_EXPECTED_BUILD_ID: ${{ inputs.expected_backup_build_id }}
        run: node scripts/verify-fresh-app-state-backup.mjs
      - name: Read-only save acceptance prerequisites
        if: inputs.verify_save_readiness
        env:
          SAVE_QA_EXPECTED_BUILD: ${{ inputs.expected_save_build_id }}
          STAGING_QA_PEER_USERNAME: ${{ secrets.STAGING_QA_PEER_USERNAME }}
          STAGING_QA_PEER_PASSWORD: ${{ secrets.STAGING_QA_PEER_PASSWORD }}
        run: |
          node --test qa/save-acceptance-readiness.test.mjs
          node scripts/verify-save-acceptance-readiness.mjs
      - name: Two-user isolated saving acceptance
        if: inputs.verify_save_acceptance
        env:
          SAVE_QA_ALLOW_FIXTURES: '1'
          SAVE_QA_CLIENT_CANDIDATE: ${{ inputs.save_candidate_client && '1' || '0' }}
          SAVE_QA_EXPECTED_BUILD: ${{ inputs.expected_save_build_id }}
        run: |
          node --test qa/save-acceptance-fixture-guards.test.mjs qa/save-acceptance-frontend.test.mjs
          npx playwright test --config=qa/save-acceptance.playwright.config.mjs
      - run: npm run qa:staging:required
