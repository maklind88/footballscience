name: QA

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  full-qa:
    uses: ./.github/workflows/full-qa.yml

  medical-startup-diagnostic:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: node scripts/ci-install.mjs
      - run: npx playwright test --config=qa/playwright.ci.config.mjs --project=chromium qa/medical-draft-recovery.smoke.spec.mjs --grep 'rescue unavailable: false' --repeat-each=30 --workers=1
