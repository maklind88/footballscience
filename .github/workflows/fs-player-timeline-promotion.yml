name: FS Player Timeline Promotion
run-name: Promote FS Player 9d1cf1e90 to footballscience.xyz

on:
  push:
    branches: [codex/fs-player-timeline-live-review]

permissions:
  contents: read

jobs:
  preflight:
    if: github.repository == 'maklind88/footballscience'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 4
          persist-credentials: false
      - name: Verify only the review harness differs from the requested main commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/promote-fs-player-timeline-once.mjs --preflight

  promote:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: footballscience-production-edge-release
      cancel-in-progress: false
    environment:
      name: fs-player-timeline-9d1cf1e90-review
      url: https://github.com/maklind88/footballscience/commit/9d1cf1e90109f3094bda3afa408f9d6f8bff2851
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 4
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.15.0
      - name: Verify and promote only the reviewed existing Vercel deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/promote-fs-player-timeline-once.mjs
      - name: Verify production health without data writes
        run: npm run release:postdeploy
