version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      app-dependencies:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /desktop/local-video-app/tracking-providers/sam2
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      sam2-security-runtime:
        applies-to: security-updates
        patterns:
          - "*"
