name: Production Monitor

on:
  workflow_dispatch:
    inputs:
      verify_medical_role:
        description: Explicit live Medical verification using a temporary medical account and one synthetic recommendation only.
        type: boolean
        default: false
      expected_medical_build_id:
        description: Exact reviewed production SHA for the explicitly authorized synthetic Medical test.
        type: string
        default: ''
      verify_fresh_backup:
        description: Create and verify a fresh production backup without restoring data.
        type: boolean
        default: false
      expected_backup_build_id:
        description: Exact reviewed production buildId from client-config (SHA or Vercel deployment ID).
        type: string
        default: ''
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ inputs.verify_medical_role && 'footballscience-production-edge-release' || 'production-monitor' }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    timeout-minutes: 20
    env:
      LIVE_QA_BASE_URL: ${{ vars.LIVE_QA_BASE_URL || 'https://footballscience.xyz' }}
      LIVE_QA_EXPECT_ADMIN: "1"
      LIVE_QA_PASSWORD: ${{ secrets.LIVE_QA_PASSWORD }}
      LIVE_QA_PEER_PASSWORD: ${{ secrets.LIVE_QA_PEER_PASSWORD }}
      LIVE_QA_PEER_USERNAME: ${{ secrets.LIVE_QA_PEER_USERNAME }}
      LIVE_QA_REQUIRE_PEER_CHAT: ${{ vars.LIVE_QA_REQUIRE_PEER_CHAT || '1' }}
      LIVE_QA_USERNAME: ${{ secrets.LIVE_QA_USERNAME }}
      LEADERBOARD_LIVE_QA_PASSWORD: ${{ secrets.LEADERBOARD_LIVE_QA_PASSWORD }}
      LEADERBOARD_LIVE_QA_TEAM_ID: ${{ vars.LEADERBOARD_LIVE_QA_TEAM_ID }}
      LEADERBOARD_LIVE_QA_USERNAME: ${{ secrets.LEADERBOARD_LIVE_QA_USERNAME }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run release:vercel-token
        if: ${{ !inputs.verify_medical_role }}
      - run: npx --yes vercel@53.2.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
        if: ${{ !inputs.verify_medical_role }}
      - name: Verify fresh production backup and read-only restore
        if: github.event_name == 'workflow_dispatch' && inputs.verify_fresh_backup && !inputs.verify_medical_role
        env:
          BACKUP_VERIFY_TARGET: production
          BACKUP_EXPECTED_BUILD_ID: ${{ inputs.expected_backup_build_id }}
        run: node scripts/verify-fresh-app-state-backup.mjs
      - run: npm run release:monitor
        if: ${{ !inputs.verify_medical_role }}
      - name: Explicit Medical-role live verification
        if: github.event_name == 'workflow_dispatch' && inputs.verify_medical_role
        env:
          MEDICAL_LIVE_TEST_INTENT: synthetic-medical-only
          MEDICAL_LIVE_EXPECTED_BUILD: ${{ inputs.expected_medical_build_id }}
        run: |
          node --test qa/medical-role-production-guards.test.mjs
          npx playwright test --config=qa/medical-role-production.config.mjs
