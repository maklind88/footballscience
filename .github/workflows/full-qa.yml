name: Full QA

on:
  workflow_call:

permissions:
  contents: read

jobs:
  static:
    name: Static and security gates
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: node scripts/ci-install.mjs
      - run: npm run release:preflight
      - run: npm run security:audit
      - run: npm run qa:static

  playwright:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API contracts
            project: api-contracts
            shard: 1
            total: 1
          - name: Browser shard 1 of 4
            project: chromium
            shard: 1
            total: 4
          - name: Browser shard 2 of 4
            project: chromium
            shard: 2
            total: 4
          - name: Browser shard 3 of 4
            project: chromium
            shard: 3
            total: 4
          - name: Browser shard 4 of 4
            project: chromium
            shard: 4
            total: 4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: node scripts/ci-install.mjs
      - run: npm run qa:playwright:ci -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.total }}
      - name: Preserve failed browser evidence
        if: failure() && matrix.project == 'chromium'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
