<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Video Analysis Smoke</title>
    <link rel="stylesheet" href="../src/modules/video-analysis/video-analysis.css">
  </head>
  <body>
    <main id="analysisRoomWorkspace"></main>
    <script type="module">
      import * as videoAnalysis from "../src/modules/video-analysis/index.js";

      const defaultClips = [
        {
          id: "clip-1",
          match_id: "2a4e615e-f3e7-4fc7-bb70-a02db63c9152",
          video_id: "26c70a43-5ee1-43f7-9e56-8e1c1be3a725",
          start_ms: 12000,
          end_ms: 18000,
          period: "1",
          phase: "In Possession",
          sub_phase: "Build Up",
          team_principle_id: "create-free-player",
          mini_game_principle_id: "third-player",
          outcome: "Positive",
          players: [{ player_id: "p1", player_label: "Alex Morgan", role: "primary" }],
          tags: ["wide", "third-player"],
          descriptors: [{ descriptor_type: "unit", descriptor_value: "Front Line" }],
          notes: [{ note: "Clean support angle." }],
        },
      ];
      const clips = (Array.isArray(window.__videoAnalysisSmokeClips) && window.__videoAnalysisSmokeClips.length
        ? window.__videoAnalysisSmokeClips
        : defaultClips
      ).map((clip) => ({ ...clip }));
      const matches = [
        {
          id: "2a4e615e-f3e7-4fc7-bb70-a02db63c9152",
          title: "Match #11 @ Angel City - May 31st - Angle 1.mp4",
          match_date: "2026-05-31",
          event_type: "match",
          schedule_event_id: "schedule-match-1",
          latest_video: {
            id: "26c70a43-5ee1-43f7-9e56-8e1c1be3a725",
            match_id: "2a4e615e-f3e7-4fc7-bb70-a02db63c9152",
            local_video_identifier: "existing-video",
          },
          latest_source: {
            id: "source-1",
            match_id: "2a4e615e-f3e7-4fc7-bb70-a02db63c9152",
            video_id: "26c70a43-5ee1-43f7-9e56-8e1c1be3a725",
            local_video_identifier: "existing-video",
          },
          clip_count: clips.length,
          video_count: 1,
          source_count: 1,
        },
      ];
      const scheduleCandidates = [
        {
          id: "schedule-training-1",
          scheduleEventId: "schedule-training-1",
          matchDate: "2026-06-02",
          eventType: "training",
          title: "MD+2 Training",
          source: "smoke",
        },
      ];
      const smartCollections = [
        {
          id: "smart-1",
          title: "Build Up Positive",
          searchJson: { phase: "In Possession", outcome: "Positive" },
        },
      ];
      let savedPresentation = {
        id: "presentation-1",
        title: "Football Science Review",
        purpose: "team-meeting",
        status: "draft",
        notes: "Team meeting notes",
        sections: [
          { id: "opening", title: "Opening", sectionType: "opening", sortOrder: 0, coachNote: "", items: [] },
          { id: "team-focus", title: "Team focus", sectionType: "team", sortOrder: 1, coachNote: "", items: [] },
          { id: "player-focus", title: "Player focus", sectionType: "player", sortOrder: 2, coachNote: "", items: [] },
        ],
        smartCollections,
        shareTargets: [],
      };
      let savedCodingTemplate = null;
      const smokeParams = new URLSearchParams(window.location.search);
      const initialStateFromQuery = smokeParams.get("reset") === "1"
        ? { view: smokeParams.get("view") || "library" }
        : window.__videoAnalysisInitialState || null;
      videoAnalysis.resetVideoAnalysisRuntimeForTests?.();

      function clipField(clip = {}, camelKey = "", snakeKey = "") {
        return clip[camelKey] ?? clip[snakeKey] ?? "";
      }

      function clipMiniGamePrincipleValues(clip = {}) {
        return [
          clipField(clip, "miniGamePrincipleId", "mini_game_principle_id"),
          ...(Array.isArray(clip.labels) ? clip.labels : [])
            .filter((label) => String(label.type || label.label_type || "").trim() === "mini_game_principle")
            .flatMap((label) => [label.value || label.label_value, label.label || label.label_text]),
        ].map((value) => String(value || "").trim().toLowerCase()).filter(Boolean);
      }

      function clipMatchesRequest(clip = {}, parsed) {
        const miniGamePrincipleId = String(parsed.searchParams.get("miniGamePrincipleId") || "").trim().toLowerCase();
        if (miniGamePrincipleId && !clipMiniGamePrincipleValues(clip).includes(miniGamePrincipleId)) return false;
        const subPhase = String(parsed.searchParams.get("subPhase") || "").trim();
        if (subPhase && String(clipField(clip, "subPhase", "sub_phase")) !== subPhase) return false;
        const outcome = String(parsed.searchParams.get("outcome") || "").trim();
        if (outcome && String(clip.outcome || "") !== outcome) return false;
        const query = String(parsed.searchParams.get("search") || "").trim().toLowerCase();
        if (!query) return true;
        return [
          clip.phase,
          clipField(clip, "subPhase", "sub_phase"),
          clip.outcome,
          clipField(clip, "miniGamePrincipleId", "mini_game_principle_id"),
          ...(clip.tags || []),
          ...(clip.players || []).map((player) => player.player_label || player.playerLabel || player.name || player.player_id || player.playerId),
          ...(clip.notes || []).map((note) => note.note),
          ...(clip.labels || []).flatMap((label) => [label.label_text || label.label, label.label_value || label.value]),
          ...(clip.descriptors || []).flatMap((descriptor) => [descriptor.descriptor_label || descriptor.label, descriptor.descriptor_value || descriptor.value]),
        ].some((value) => String(value || "").toLowerCase().includes(query));
      }

      window.fetch = async (url, options = {}) => {
        const parsed = new URL(url, window.location.origin);
        const action = parsed.searchParams.get("action");
        const body = options.body ? JSON.parse(options.body) : {};
        window.__videoAnalysisRequests = window.__videoAnalysisRequests || [];
        window.__videoAnalysisRequests.push({ action, body });
        if (action === "status") return Response.json({ ok: true, schema: "footballscience-video-analysis-v2" });
        if (action === "matches") return Response.json({ ok: true, schema: "footballscience-video-analysis-v2", matches, scheduleCandidates });
        if (action === "clips") {
          const limit = Math.max(1, Number(parsed.searchParams.get("limit") || clips.length || 1));
          const offset = Math.max(0, Number(parsed.searchParams.get("offset") || 0));
          const filteredClips = clips.filter((clip) => clipMatchesRequest(clip, parsed));
          const pageClips = filteredClips.slice(offset, offset + limit);
          return Response.json({ ok: true, schema: "footballscience-video-analysis-v2", clips: pageClips, pageSize: pageClips.length });
        }
        if (action === "saved-searches") return Response.json({ ok: true, schema: "footballscience-video-analysis-v2", savedSearches: [] });
        if (action === "save-search") return Response.json({ ok: true, schema: "footballscience-video-analysis-v2", savedSearch: { id: "search-1", title: "Build Up Development" } });
        if (action === "save-review-session") return Response.json({ ok: true, schema: "footballscience-video-analysis-v2", reviewSession: { id: "review-1" } });
        if (action === "coding-templates") {
          return Response.json({
            ok: true,
            schema: "footballscience-video-analysis-v2",
            templates: savedCodingTemplate ? [savedCodingTemplate] : [],
          });
        }
        if (action === "save-coding-template") {
          savedCodingTemplate = {
            id: "coding-template-1",
            databaseId: "coding-template-1",
            ...(body.template || {}),
          };
          return Response.json({ ok: true, schema: "footballscience-video-analysis-v2", template: savedCodingTemplate });
        }
        if (action === "list-presentations") {
          return Response.json({
            ok: true,
            schema: "footballscience-video-analysis-v2",
            presentations: [savedPresentation],
            smartCollections,
          });
        }
        if (action === "get-presentation") {
          return Response.json({ ok: true, schema: "footballscience-video-analysis-v2", presentation: savedPresentation });
        }
        if (action === "list-presentation-clips") {
          const limit = Math.max(1, Number(parsed.searchParams.get("limit") || clips.length || 1));
          const offset = Math.max(0, Number(parsed.searchParams.get("offset") || 0));
          const filteredClips = clips.filter((clip) => clipMatchesRequest(clip, parsed));
          const pageClips = filteredClips.slice(offset, offset + limit);
          return Response.json({ ok: true, schema: "footballscience-video-analysis-v2", clips: pageClips, pageSize: pageClips.length, total: filteredClips.length });
        }
        if (action === "save-presentation") {
          savedPresentation = {
            ...savedPresentation,
            ...(body.presentation || {}),
            id: body.presentation?.id || savedPresentation.id,
          };
          return Response.json({ ok: true, schema: "footballscience-video-analysis-v2", presentation: savedPresentation });
        }
        if (action === "save-smart-collection") {
          const input = body.smartCollection || {};
          const existingIndex = smartCollections.findIndex((item) => item.id === input.id);
          const smartCollection = { ...input, id: input.id || `smart-${smartCollections.length + 1}` };
          if (existingIndex >= 0) smartCollections.splice(existingIndex, 1, smartCollection);
          else smartCollections.unshift(smartCollection);
          return Response.json({ ok: true, schema: "footballscience-video-analysis-v2", smartCollection });
        }
        if (action === "save-smart-collection-share-targets") {
          const collection = smartCollections.find((item) => item.id === body.collectionId);
          if (collection) collection.shareTargets = body.targets || [];
          return Response.json({ ok: true, schema: "footballscience-video-analysis-v2", shareTargets: body.targets || [] });
        }
        if (action === "save-drawing-layer") {
          return Response.json({
            ok: true,
            schema: "footballscience-video-analysis-v2",
            drawingLayer: { id: "drawing-1", ...(body.drawingLayer || {}) },
          });
        }
        if (action === "save-share-targets") {
          return Response.json({ ok: true, schema: "footballscience-video-analysis-v2", shareTargets: body.targets || [] });
        }
        if (action === "save-clip") {
          const input = body.clip || {};
          const existingClip = input.id ? clips.find((item) => item.id === input.id) : null;
          const clip = {
            ...(existingClip || {}),
            id: input.id || `clip-${clips.length + 1}`,
            match_id: input.matchId || input.match_id || matches[0].id,
            video_id: input.videoId || input.video_id || matches[0].latest_video.id,
            start_ms: input.startMs ?? input.start_ms ?? 0,
            end_ms: input.endMs ?? input.end_ms ?? 15000,
            period: input.period || "1",
            phase: input.phase || "In Possession",
            sub_phase: input.subPhase || input.sub_phase || "Build Up",
            team_principle_id: input.teamPrincipleId || input.team_principle_id || "create-free-player",
            mini_game_principle_id: input.miniGamePrincipleId || input.mini_game_principle_id || existingClip?.miniGamePrincipleId || existingClip?.mini_game_principle_id || "",
            outcome: input.outcome || "Neutral",
            coding_mode: input.codingMode || input.coding_mode || "instant",
            coding_template_id: input.codingTemplateId || input.coding_template_id || "",
            coding_button_id: input.codingButtonId || input.coding_button_id || "",
            pre_roll_ms: input.preRollMs ?? input.pre_roll_ms ?? 0,
            post_roll_ms: input.postRollMs ?? input.post_roll_ms ?? 0,
            visibility: input.visibility || "private",
            labels: Array.isArray(input.labels) ? input.labels : existingClip?.labels || [],
            players: Array.isArray(input.players) && input.players.length
              ? input.players
              : input.playerId
                ? [{ player_id: input.playerId, player_label: input.playerId, role: input.playerRole || "primary" }]
                : [],
            tags: input.tags || [],
            descriptors: input.descriptors || [],
            notes: input.notes || [],
          };
          if (existingClip) Object.assign(existingClip, clip);
          else clips.push(clip);
          return Response.json({ ok: true, schema: "footballscience-video-analysis-v2", clip });
        }
        if (action === "trim-clip") {
          const input = body.clip || {};
          const clip = clips.find((item) => item.id === input.id || item.id === input.clipId);
          if (!clip) return Response.json({ ok: false, reason: "Clip not found." }, { status: 404 });
          clip.start_ms = input.startMs ?? input.start_ms ?? clip.start_ms;
          clip.end_ms = input.endMs ?? input.end_ms ?? clip.end_ms;
          return Response.json({ ok: true, schema: "footballscience-video-analysis-v2", clip });
        }
        if (action === "archive-clip") {
          const id = body.id || body.clipId || body.clip_id;
          const archived = clips.find((item) => item.id === id) || null;
          const nextClips = clips.filter((item) => item.id !== id);
          clips.splice(0, clips.length, ...nextClips);
          return Response.json({ ok: true, schema: "footballscience-video-analysis-v2", clip: archived });
        }
        if (action === "archive-clips") {
          const ids = new Set((body.ids || body.clipIds || body.clip_ids || []).map((id) => String(id || "")));
          const archivedIds = clips.filter((item) => ids.has(item.id)).map((item) => item.id);
          const nextClips = clips.filter((item) => !ids.has(item.id));
          clips.splice(0, clips.length, ...nextClips);
          return Response.json({ ok: true, schema: "footballscience-video-analysis-v2", archivedIds, clips: [] });
        }
        if (action === "update-match-link") {
          const match = matches.find((item) => item.id === body.matchId) || matches[0];
          Object.assign(match, {
            match_date: body.matchDate || match.match_date,
            event_type: body.eventType || match.event_type,
            schedule_event_id: body.scheduleEventId || "",
          });
          return Response.json({ ok: true, schema: "footballscience-video-analysis-v2", match });
        }
        if (action === "create-local-video-source") {
          return Response.json({
            ok: true,
            schema: "footballscience-video-analysis-v2",
            match: {
              id: body.matchId || "2a4e615e-f3e7-4fc7-bb70-a02db63c9152",
              title: body.matchTitle || "Smoke match",
              match_date: body.matchDate || "2026-05-31",
              event_type: body.eventType || "match",
              schedule_event_id: body.scheduleEventId || "",
            },
            video: { id: "26c70a43-5ee1-43f7-9e56-8e1c1be3a725", match_id: "2a4e615e-f3e7-4fc7-bb70-a02db63c9152" },
            source: {
              id: "source-1",
              match_id: "2a4e615e-f3e7-4fc7-bb70-a02db63c9152",
              video_id: "26c70a43-5ee1-43f7-9e56-8e1c1be3a725",
              local_video_identifier: body.localVideoIdentifier || "",
            },
          });
        }
        return Response.json({ ok: false, reason: "Unexpected smoke action." }, { status: 400 });
      };

      const context = {
        ui: { analysisRoomWorkspace: document.getElementById("analysisRoomWorkspace") },
        win: window,
        allowVideoAnalysisMetadataLoad: true,
        getAuthToken: () => "smoke-token",
        canEdit: () => true,
        videoAnalysisInitialState: initialStateFromQuery,
        getScheduleState: () => ({
          events: [
            { id: "schedule-match-1", date: "2026-05-31", type: "match", title: "Angel City away" },
            { id: "schedule-training-1", date: "2026-06-02", type: "training", title: "MD+2 Training" },
          ],
        }),
        getPlayerProfilesState: () => ({
          players: [
            { id: "p1", name: "Alex Morgan", number: "13", position: "ST" },
            { id: "p2", name: "Debinha", number: "10", position: "10" },
          ],
        }),
      };

      videoAnalysis.render(context);
      for (const type of ["click", "input", "change", "submit", "keydown"]) {
        context.ui.analysisRoomWorkspace.addEventListener(type, (event) => {
          const handler = videoAnalysis[`handle${type[0].toUpperCase()}${type.slice(1)}`];
          handler?.(event, context);
        });
      }
    </script>
  </body>
</html>
