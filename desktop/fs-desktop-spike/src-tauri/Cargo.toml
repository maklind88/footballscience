[package]
name = "fs-desktop-architecture-spike"
version = "0.0.1"
description = "Local delivery-model and least-privilege bridge spike for Football Science"
edition = "2024"

[lib]
name = "fs_desktop_architecture_spike_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
reqwest = { version = "=0.13.4", features = ["blocking", "json"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
semver = "=1.0.27"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = [] }
uuid = { version = "=1.26.0", features = ["v4"] }
