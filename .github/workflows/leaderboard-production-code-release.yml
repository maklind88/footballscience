name: Leaderboard Files Preview Proof

# Dispatch prerequisite: a fresh owner/admin read-only audit must prove that both
# protected environments contain exactly zero environment secrets and variables.
# The read-only GITHUB_TOKEN below proves IDs/protection/main-only policy only;
# it never claims visibility into hidden secret or variable counts.

on:
  workflow_dispatch:
    inputs:
      expected_orchestration_sha:
        description: Exact trusted-main SHA containing only the reviewed Files preview rail
        required: true
        type: string
      expected_staging_deployment_id:
        description: Exact reviewed READY deployment currently serving staging
        required: true
        type: string
      expected_plan_environment_id:
        description: Exact pre-created protected PLAN environment id
        required: true
        type: string
      expected_preview_apply_environment_id:
        description: Exact pre-created protected PREVIEW-APPLY environment id
        required: true
        type: string
      production_db_observed_at:
        description: Fresh reviewer/MCP production DB observation timestamp
        required: true
        type: string
      production_db_attestation_sha256:
        description: Canonical SHA256 for exact 48/V/catalog/rows0 evidence
        required: true
        type: string
      freeze_observed_at:
        description: Fresh owner/admin no-bypass branch and tag freeze observation
        required: true
        type: string
      freeze_attestation_sha256:
        description: Canonical SHA256 binding both dynamic rulesets and empty bypass actors
        required: true
        type: string
      preview_attempt_nonce:
        description: Unique reviewed nonce for this exact one-create preview attempt
        required: true
        type: string
      confirmation:
        description: PROVE_LEADERBOARD_FILES_PREVIEW_C1_<exact orchestration SHA>
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: footballscience-production-edge-release
  cancel-in-progress: false

env:
  CANDIDATE_SHA: c1b1821ab796bb680eb3480979542b6a461af964
  CANDIDATE_TREE: 4f1313f370d647fbffaa20236f6dee6a4412006a

jobs:
  environment-preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted orchestration rail
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up exact Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.15.0

      - name: Verify protected environment IDs and policies (external zero-count gate required)
        run: node scripts/leaderboard-production-code-release.mjs --mode environment-preflight
        env:
          EXPECTED_PLAN_ENVIRONMENT_ID: ${{ inputs.expected_plan_environment_id }}
          EXPECTED_PREVIEW_APPLY_ENVIRONMENT_ID: ${{ inputs.expected_preview_apply_environment_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  plan:
    if: github.ref == 'refs/heads/main' && needs.environment-preflight.result == 'success'
    needs: environment-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: leaderboard-production-code-release-plan
    outputs:
      artifact_sha256: ${{ steps.plan.outputs.artifact_sha256 }}
      plan_sha256: ${{ steps.plan.outputs.plan_sha256 }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Checkout trusted orchestration rail with candidate objects
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Fetch immutable main and staging refs
        shell: bash
        run: git fetch --quiet --no-tags origin +refs/heads/main:refs/remotes/origin/main +refs/heads/staging:refs/remotes/origin/staging

      - name: Set up exact Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.15.0

      - name: Build read-only immutable Files preview plan
        id: plan
        run: node scripts/leaderboard-production-code-release.mjs --mode plan
        env:
          EXPECTED_ORCHESTRATION_SHA: ${{ inputs.expected_orchestration_sha }}
          EXPECTED_PLAN_ENVIRONMENT_ID: ${{ inputs.expected_plan_environment_id }}
          EXPECTED_PREVIEW_APPLY_ENVIRONMENT_ID: ${{ inputs.expected_preview_apply_environment_id }}
          EXPECTED_STAGING_DEPLOYMENT_ID: ${{ inputs.expected_staging_deployment_id }}
          FREEZE_ATTESTATION_SHA256: ${{ inputs.freeze_attestation_sha256 }}
          FREEZE_OBSERVED_AT: ${{ inputs.freeze_observed_at }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIVE_QA_PASSWORD: ${{ secrets.LIVE_QA_PASSWORD }}
          LIVE_QA_USERNAME: ${{ secrets.LIVE_QA_USERNAME }}
          PLAN_ARTIFACT_PATH: ${{ runner.temp }}/leaderboard-files-preview-plan/plan.json
          PREVIEW_ATTEMPT_NONCE: ${{ inputs.preview_attempt_nonce }}
          PRODUCTION_DB_ATTESTATION_SHA256: ${{ inputs.production_db_attestation_sha256 }}
          PRODUCTION_DB_OBSERVED_AT: ${{ inputs.production_db_observed_at }}
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
          STAGING_QA_PASSWORD: ${{ secrets.STAGING_QA_PASSWORD }}
          STAGING_QA_USERNAME: ${{ secrets.STAGING_QA_USERNAME }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Upload immutable secret-free Files preview plan
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: leaderboard-files-preview-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/leaderboard-files-preview-plan/plan.json
          if-no-files-found: error
          retention-days: 1

  preview-apply:
    if: github.ref == 'refs/heads/main' && needs.plan.result == 'success'
    needs: plan
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble@sha256:b0ab6f3cb99aa7803adbc14d9027ec1785fc6e433b97e134e0f8fe61683b6b53
    timeout-minutes: 70
    environment:
      name: leaderboard-production-code-release-apply
    outputs:
      preview_deployment_id: ${{ steps.preview.outputs.preview_deployment_id }}
      preview_deployment_url: ${{ steps.preview.outputs.preview_deployment_url }}
    steps:
      - name: Checkout trusted orchestration rail with candidate objects
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Fetch immutable main and staging refs
        shell: bash
        run: git fetch --quiet --no-tags origin +refs/heads/main:refs/remotes/origin/main +refs/heads/staging:refs/remotes/origin/staging

      - name: Set up exact Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install tracked QA dependencies
        run: npm ci

      - name: Normalize proven npm-ci drift
        run: node scripts/leaderboard-production-code-release.mjs --mode normalize
        env:
          TARGET_DIR: ${{ github.workspace }}

      - name: Download exact same-run Files preview plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: leaderboard-files-preview-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/leaderboard-files-preview-plan

      - name: Normalize downloaded plan permissions
        shell: bash
        run: |
          chmod 0700 "${RUNNER_TEMP}/leaderboard-files-preview-plan"
          chmod 0600 "${RUNNER_TEMP}/leaderboard-files-preview-plan/plan.json"

      - name: Upload candidate files and create exactly one isolated preview
        id: preview
        run: node scripts/leaderboard-production-code-release.mjs --mode preview-apply
        env:
          EXPECTED_ARTIFACT_SHA256: ${{ needs.plan.outputs.artifact_sha256 }}
          EXPECTED_ORCHESTRATION_SHA: ${{ inputs.expected_orchestration_sha }}
          EXPECTED_PLAN_ENVIRONMENT_ID: ${{ inputs.expected_plan_environment_id }}
          EXPECTED_PREVIEW_APPLY_ENVIRONMENT_ID: ${{ inputs.expected_preview_apply_environment_id }}
          EXPECTED_STAGING_DEPLOYMENT_ID: ${{ inputs.expected_staging_deployment_id }}
          EXPECTED_UPLOAD_DIGEST: ${{ needs.plan.outputs.artifact_digest }}
          FREEZE_ATTESTATION_SHA256: ${{ inputs.freeze_attestation_sha256 }}
          FREEZE_OBSERVED_AT: ${{ inputs.freeze_observed_at }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIVE_QA_PASSWORD: ${{ secrets.LIVE_QA_PASSWORD }}
          LIVE_QA_USERNAME: ${{ secrets.LIVE_QA_USERNAME }}
          PLAN_ARTIFACT_PATH: ${{ runner.temp }}/leaderboard-files-preview-plan/plan.json
          PREVIEW_ATTEMPT_NONCE: ${{ inputs.preview_attempt_nonce }}
          PRODUCTION_DB_ATTESTATION_SHA256: ${{ inputs.production_db_attestation_sha256 }}
          PRODUCTION_DB_OBSERVED_AT: ${{ inputs.production_db_observed_at }}
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
          STAGING_QA_PASSWORD: ${{ secrets.STAGING_QA_PASSWORD }}
          STAGING_QA_USERNAME: ${{ secrets.STAGING_QA_USERNAME }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
