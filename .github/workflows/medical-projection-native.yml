name: Medical Projection Native
on:
  workflow_dispatch:
    inputs:
      expected_production_build:
        description: Optional exact production SHA for read-only Medical mode verification; empty skips it.
        type: string
        default: ''
  pull_request:
    paths:
      - 'scripts/release-artifacts/medical-projection-forward-only.sql'
      - 'scripts/release-artifacts/medical-production-timestamp-only.sql'
      - 'scripts/release-artifacts/medical-recommendation-confirmation.sql'
      - 'qa/helpers/medical-confirmation-postgres.mjs'
      - 'qa/helpers/medical-journey-staging-browser.mjs'
      - 'qa/helpers/medical-reconnect-guard.mjs'
      - 'qa/helpers/medical-reconnect-scenario.mjs'
      - 'qa/medical-reconnect-guard.api.spec.mjs'
      - 'qa/medical-journey.staging.spec.mjs'
      - 'qa/medical-reconnect-harness.native-browser.spec.mjs'
      - 'qa/medical-mixed-client-acceptance.native-browser.spec.mjs'
      - 'qa/playwright.medical-confirmation.config.mjs'
      - 'api/_lib/medical-database.js'
      - 'platform-auth-boot.js'
      - 'src/modules/medical/medical-runtime-bindings.mjs'
      - 'scripts/verify-medical-production-mode.mjs'
      - 'qa/medical-production-mode.test.mjs'
      - 'qa/medical-projection-forward-native.test.mjs'
      - 'qa/medical-multiwriter-acceptance-native.test.mjs'
      - '.github/workflows/medical-projection-native.yml'
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - name: Prepare isolated PostgreSQL 17 tools
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl mask postgresql.service postgresql@.service
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --max-time 30 \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc -o "$RUNNER_TEMP/pgdg.asc"
          test "$(gpg --show-keys --with-colons "$RUNNER_TEMP/pgdg.asc" | awk -F: '$1 == "fpr" {print $10; exit}')" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          sudo install -m 644 "$RUNNER_TEMP/pgdg.asc" /usr/share/keyrings/fs-recovery-pgdg.asc
          printf '%s\n' 'deb [signed-by=/usr/share/keyrings/fs-recovery-pgdg.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/fs-recovery-pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends postgresql-17 postgresql-client-17
      - name: Test forward-only alignment without remote credentials
        env:
          FS_RECOVERY_PG_BIN: /usr/lib/postgresql/17/bin
        run: node --test qa/medical-projection-forward-native.test.mjs qa/medical-multiwriter-acceptance-native.test.mjs
      - name: Prepare mixed-client browsers
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: Test old and new browser clients against real API and PostgreSQL
        env:
          FS_RECOVERY_PG_BIN: /usr/lib/postgresql/17/bin
        run: npx playwright test --config=qa/playwright.medical-confirmation.config.mjs --reporter=list
  production-mode:
    if: github.event_name == 'workflow_dispatch' && inputs.expected_production_build != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - name: Verify probe guards without credentials
        run: node --test qa/medical-production-mode.test.mjs
      - name: Read actual Medical runtime mode and revoke own QA session
        env:
          MEDICAL_EXPECTED_PRODUCTION_BUILD: ${{ inputs.expected_production_build }}
          LIVE_QA_USERNAME: ${{ secrets.LIVE_QA_USERNAME }}
          LIVE_QA_PASSWORD: ${{ secrets.LIVE_QA_PASSWORD }}
        run: node scripts/verify-medical-production-mode.mjs
